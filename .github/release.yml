changelog:
  exclude:
    labels: [skip changelog]
  categories:
    - title: Breaking changes
      labels: [breaking change]
    - title: Features
      labels: ['type: feature']
    - title: Fixes
      labels: ['type: fix']
    - title: Performance
      labels: ['type: performance']
    - title: Maintenance
      labels: ['type: maintenance']
    - title: Other changes
      labels: ['*']

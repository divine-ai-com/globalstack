version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: build(deps)
    labels: [dependencies]
    groups:
      compatible-updates:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci(deps)
    labels: [dependencies, ci]
    groups:
      compatible-updates:
        patterns: ['*']
        update-types: [minor, patch]

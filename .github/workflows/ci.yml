name: Local checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.14.1
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
        if: matrix.node == 22
      - run: npm run check:local
      - run: npm run test:gcp:unit
      - run: npm run test:repository
      - run: npm run demo
  gate:
    name: CI gate
    needs: local
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every local matrix job
        env:
          RESULT: ${{ needs.local.result }}
        run: test "$RESULT" = success

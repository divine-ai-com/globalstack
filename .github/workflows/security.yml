name: Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete reachable history with Gitleaks
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts='--all' --redact=100 --no-banner
      - name: Check reviewed fixture exceptions remain narrow
        run: node scripts/repository/check-research-secret-scan.mjs "$RUNNER_TEMP/gitleaks"
  dependencies:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - name: Audit the locked Pulumi TypeScript sample
        run: |
          npm run render
          npm --prefix dist/platform-images/azure-pulumi-ts/sample-task audit --omit=dev --audit-level=moderate
      - name: Review new dependencies and license metadata
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          allow-licenses: Apache-2.0, MIT, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD, Unlicense, CC0-1.0, BlueOak-1.0.0, Python-2.0
          # Reviewed attribution-only data package; other CC-BY dependencies still require review.
          allow-dependencies-licenses: pkg:npm/spdx-exceptions@2.5.0
          comment-summary-in-pr: never
      - name: Generate dependency inventory
        run: npm sbom --sbom-format cyclonedx > "$RUNNER_TEMP/globalstack-sbom.json"
      - name: Retain the dependency inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-inventory
          path: ${{ runner.temp }}/globalstack-sbom.json
          retention-days: 14
          if-no-files-found: error
  codeql:
    name: CodeQL JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Include existing findings in the merge gate, not only changed-code findings.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          category: javascript-security
          output: codeql-results
          upload-database: false
      - name: Block high and critical security findings
        run: node scripts/repository/check-sarif.mjs codeql-results
      - name: Retain the complete static analysis report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-results
          path: codeql-results/*.sarif
          retention-days: 14
          if-no-files-found: error
  gate:
    name: Security gate
    needs: [secrets, dependencies, codeql]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every security check
        env:
          SECRETS: ${{ needs.secrets.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          CODEQL: ${{ needs.codeql.result }}
        run: |
          test "$SECRETS" = success
          test "$DEPENDENCIES" = success
          test "$CODEQL" = success

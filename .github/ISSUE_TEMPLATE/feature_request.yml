name: Feature request
description: Propose a capability or workflow
labels: [enhancement]
body:
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: What are you trying to build or test?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: List the service, operations and behavior you need
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation approach
      description: Suggest documentation, sanitized fixtures or runnable examples

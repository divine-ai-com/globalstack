services:
  globalstack-azure:
    image: ${GLOBALSTACK_AZURE_IMAGE:-globalstack/azure-emulator:local}
    container_name: ${COMPOSE_PROJECT_NAME:-globalstack-shipment}-azure
    labels:
      io.globalstack.owner: globalstack
      io.globalstack.product: azure-emulator
      io.globalstack.scope: shipment-runtime
      io.globalstack.cloud: azure
      io.globalstack.platform: ${PLATFORM_ID:-unknown}
    environment:
      GLOBALSTACK_AUTH_TOKEN: ${GLOBALSTACK_AUTH_TOKEN:?GLOBALSTACK_AUTH_TOKEN must already be exported in the host shell}
      GLOBALSTACK_ARM_HOST: 0.0.0.0
      GLOBALSTACK_ARM_PORT: 4566
      GLOBALSTACK_AZURE_SUBSCRIPTION_ID: ${ARM_SUBSCRIPTION_ID:-00000000-0000-0000-0000-000000000000}
      GLOBALSTACK_AZURE_TENANT_ID: ${ARM_TENANT_ID:-00000000-0000-0000-0000-000000000000}
      GLOBALSTACK_AZURE_CLIENT_ID: ${ARM_CLIENT_ID:-11111111-1111-1111-1111-111111111111}
      GLOBALSTACK_AZURE_CLIENT_SECRET: ${ARM_CLIENT_SECRET:-globalstack}
      GLOBALSTACK_POSTGRES_ENDPOINT: postgres://globalstack:globalstack@local-postgres:5432/postgres
      GLOBALSTACK_MYSQL_ENDPOINT: mysql://globalstack:globalstack@local-mysql:3306/globalstack
      DEBUG: ${DEBUG:-1}
    volumes:
      - ./volume:/var/lib/globalstack
    depends_on:
      local-postgres:
        condition: service_started
      local-mysql:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4566/_globalstack/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  runner:
    image: ${GLOBALSTACK_RUNNER_IMAGE:?GLOBALSTACK_RUNNER_IMAGE must be exported by run.sh}
    network_mode: "service:globalstack-azure"
    depends_on:
      globalstack-azure:
        condition: service_healthy
    labels:
      io.globalstack.owner: globalstack
      io.globalstack.product: azure-runner
      io.globalstack.scope: shipment-runtime
      io.globalstack.cloud: azure
      io.globalstack.platform: ${PLATFORM_ID:-unknown}
    environment:
      PROVIDER: ${PROVIDER:-GlobalStack}
      CLOUD_PROVIDER: ${CLOUD_PROVIDER:-azure}
      PLATFORM_ID: ${PLATFORM_ID:?PLATFORM_ID must be exported by run.sh}
      LANGUAGE: ${LANGUAGE:?LANGUAGE must be exported by run.sh}
      TOOLCHAIN: ${TOOLCHAIN:?TOOLCHAIN must be exported by run.sh}
      ENVIRONMENT_SUFFIX: ${ENVIRONMENT_SUFFIX:-dev}
      AZURE_LOCATION: ${AZURE_LOCATION:-eastus}
      AZURE_ENDPOINT_URL: http://localhost:4566
      ARM_ENDPOINT: http://localhost:4566
      ARM_RESOURCE_MANAGER_ENDPOINT: http://localhost:4566/
      GLOBALSTACK_AZURE_HOST: localhost
      PIPELINE_STAGE_SCOPE: ${PIPELINE_STAGE_SCOPE:-full}
    volumes:
      - ${LOCAL_TASK_PATH:?LOCAL_TASK_PATH must be exported by run.sh}:/workspace/task:ro
      - ./reports:/workspace/reports
      - ./work:/workspace/work

  local-postgres:
    image: postgres:16-alpine
    labels:
      io.globalstack.owner: globalstack
      io.globalstack.product: azure-runtime-backend
      io.globalstack.scope: shipment-runtime
      io.globalstack.cloud: azure
      io.globalstack.backend: local-postgres
    environment:
      POSTGRES_USER: globalstack
      POSTGRES_PASSWORD: globalstack
      POSTGRES_DB: postgres

  local-mysql:
    image: mysql:8
    labels:
      io.globalstack.owner: globalstack
      io.globalstack.product: azure-runtime-backend
      io.globalstack.scope: shipment-runtime
      io.globalstack.cloud: azure
      io.globalstack.backend: local-mysql
    environment:
      MYSQL_ROOT_PASSWORD: globalstack-root
      MYSQL_DATABASE: globalstack
      MYSQL_USER: globalstack
      MYSQL_PASSWORD: globalstack
